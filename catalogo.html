<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | DUEL MARKET</title>
  <link rel="stylesheet" href="styles.css">
  <script src="db.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="header-bar">
      <a class="brand-title" href="index.html">DUEL MARKET TCG</a>
      <nav class="site-nav" aria-label="Navegación principal"><a href="index.html">Inicio</a><a href="catalogo.html" aria-current="page">Catálogo</a></nav>
      <div class="header-actions">
        <button id="theme-btn" class="button-secondary" type="button" aria-pressed="false">☾ Modo oscuro</button>
        <button id="login-btn" class="button-secondary" type="button">Iniciar sesión</button>
        <a id="btn-cart" class="button button-primary" href="carrito.html" aria-label="Abrir carrito, artículos: 0">🛒 Carrito (<span id="cart-count">0</span>)</a>
      </div>
    </div>
  </header>
  <main>
    <h1>Catálogo Yu-Gi-Oh!</h1>
    <button id="voice-btn" class="button-secondary" type="button" aria-pressed="false">Lectura por voz: desactivada</button><span id="voice-status" class="visually-hidden" role="status" aria-live="polite"></span>
    <p>Artículos en venta por tiendas verificadas.</p>
    <form id="catalog-filters" role="search">
      <div class="form-row">
        <div class="form-group"><label for="search-input">Buscar carta</label><input id="search-input" type="search" placeholder="Nombre de la carta"></div>
        <div class="form-group"><label for="filter-type">Tipo de carta</label><select id="filter-type"><option value="ALL">Todos</option><option>Monstruo</option><option>Mágica</option><option>Trampa</option></select></div>
        <div class="form-group"><label for="filter-attr">Atributo</label><select id="filter-attr"><option value="ALL">Todos</option><option>OSCURIDAD</option><option>LUZ</option><option>FUEGO</option><option>MÁGICA</option><option>TRAMPA</option></select></div>
        <div class="form-group"><label for="sort-order">Ordenar resultados</label><select id="sort-order"><option value="price-asc">Precio: Menor a Mayor</option><option value="price-desc">Precio: Mayor a Menor</option><option value="name-asc">Alfabético (A-Z)</option></select></div>
      </div>
      <button class="button-secondary" type="reset">Restablecer filtros</button>
    </form>
    <section aria-label="Resultados de cartas"><h2 class="visually-hidden">Resultados</h2><div id="product-list" class="card-grid" aria-live="polite"></div><nav id="catalog-pagination" class="pagination" aria-label="Páginas del catálogo"></nav></section>
  </main>
  <aside id="recently-viewed" class="recently-viewed" aria-label="Cartas vistas recientemente">
    <details>
      <summary>Vistos recientemente <span id="recently-viewed-count">0</span></summary>
      <ul id="recently-viewed-list"></ul>
    </details>
  </aside>
  <footer><p>DUEL MARKET TCG · Prototipo académico</p></footer>
</body>
</html>
