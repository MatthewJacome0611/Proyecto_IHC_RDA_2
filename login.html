<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | DUEL MARKET</title>
  <link rel="stylesheet" href="styles.css">
  <script src="db.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="header-bar"><a class="brand-title" href="index.html">DUEL MARKET TCG</a><div class="header-actions"><button id="theme-btn" class="button-secondary" type="button" aria-pressed="false">☾ Modo oscuro</button><span>Carrito: <a href="carrito.html"><span id="cart-count">0</span> artículos</a></span><span>Favoritos: <a href="favoritos.html"><span id="favorite-count">0</span></a></span></div></div>
    <nav class="site-nav" aria-label="Navegación principal"><a href="index.html">Inicio</a><a href="catalogo.html">Catálogo</a><a href="detalle.html">Detalle</a><a href="carrito.html">Carrito</a><a href="checkout.html">Checkout</a><a href="confirmacion.html">Confirmación</a><a href="login.html" aria-current="page">Iniciar sesión</a><a href="favoritos.html">Favoritos</a></nav>
  </header>
  <main>
    <h1>Iniciar sesión</h1>
    <button id="voice-btn" class="button-secondary" type="button" aria-pressed="false">Lectura por voz: desactivada</button><span id="voice-status" class="visually-hidden" role="status" aria-live="polite"></span>
    <p>Acceso de demostración: usa un correo válido y una contraseña de seis caracteres o más. No se envían datos.</p>
    <form id="login-form">
      <div class="form-group"><label for="login-email">Correo electrónico</label><input id="login-email" name="email" type="email" autocomplete="email" required></div>
      <div class="form-group"><label for="login-password">Contraseña de prueba</label><input id="login-password" name="password" type="password" autocomplete="current-password" minlength="6" required></div>
      <p id="login-status" class="status" role="status" aria-live="polite"></p>
      <button class="button-primary" type="submit">Iniciar sesión</button>
    </form>
  </main>
  <footer><p>DUEL MARKET TCG · Prototipo académico</p></footer>
</body>
</html>
