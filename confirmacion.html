<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmación | DUEL MARKET</title>
  <link rel="stylesheet" href="styles.css">
  <script src="db.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="header-bar">
      <a class="brand-title" href="index.html">DUEL MARKET TCG</a>
      <nav class="site-nav" aria-label="Navegación principal"><a href="index.html">Inicio</a><a href="catalogo.html">Catálogo</a></nav>
      <div class="header-actions">
        <button id="theme-btn" class="button-secondary" type="button" aria-pressed="false">☾ Modo oscuro</button>
        <button id="login-btn" class="button-secondary" type="button">Iniciar sesión</button>
        <a id="btn-cart" class="button button-primary" href="carrito.html" aria-label="Abrir carrito, artículos: 0">🛒 Carrito (<span id="cart-count">0</span>)</a>
      </div>
    </div>
  </header>
  <main id="order-details">
    <h1>Pedido confirmado</h1>
    <button id="voice-btn" class="button-secondary" type="button" aria-pressed="false">Lectura por voz: desactivada</button><span id="voice-status" class="visually-hidden" role="status" aria-live="polite"></span>
    <p class="notice">¡Gracias por tu compra de demostración!</p>
    <dl>
      <dt>Identificador del pedido</dt><dd id="order-id">YGO-00000</dd>
      <dt>Persona que recibe</dt><dd id="order-recipient">No indicado</dd>
      <dt>Dirección de entrega</dt><dd id="order-address">No indicada</dd>
      <dt>Método de pago</dt><dd id="order-method">No indicado</dd>
    </dl>
    <p><a class="button button-primary" href="catalogo.html">Regresar al catálogo</a></p>
  </main>
  <footer><p>DUEL MARKET TCG · Prototipo académico</p></footer>
</body>
</html>
